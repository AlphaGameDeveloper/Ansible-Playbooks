- name: ZSH-UNINSTALL | Ensure ZSH is removed
  ansible.builtin.apt:
    name: zsh
    state: absent
  become: true
- name: ZSH-UNINSTALL | Remove Oh My Zsh directory
  ansible.builtin.file:
    path: ~/.oh-my-zsh
    state: absent
- name: ZSH-UNINSTALL | Remove .zshrc file
  ansible.builtin.file:
    path: ~/.zshrc
    state: absent
- name: ZSH-UNINSTALL | Remove .p10k.zsh file
  ansible.builtin.file:
    path: ~/.p10k.zsh
    state: absent
- name: ZSH-UNINSTALL | Remove dotfiles repository
  ansible.builtin.file:
    path: ~/dotfiles
    state: absent
- name: ZSH-UNINSTALL | Reset default shell to bash
  ansible.builtin.command:
    cmd: chsh -s /bin/bash
  when: ansible_user_shell != '/bin/bash'
  become: true
  