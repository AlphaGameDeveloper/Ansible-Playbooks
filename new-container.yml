# this playbook sets up a new container from zero
# it is meant to be run on a new container

- name: Setup a new Proxmox container
  hosts: lxc
  become: true
  gather_facts: true
  
  vars:
    munin_master_host: goliath
    gpg_key_id: "4206837B898B4BD2"
    install_zsh_dotfiles: false
    uninstall_zsh_dotfiles: false
    smtp: false
    munin_plugins:
      - contrib/traffic
    packages:
      - curl
      - git
      - net-tools
      - htop
      
  tasks:
    # - name: Ensure ZSH options make sense
    #   ansible.builtin.assert:
    #     that:
    #       - not ((install_zsh_dotfiles | bool) and (uninstall_zsh_dotfiles | bool))
    #     fail_msg: "install_zsh_dotfiles and uninstall_zsh_dotfiles cannot both be true"
    - import_tasks: homelab/new-container-setup/permit-root-login.yml
    - name: force colored command line
      ansible.builtin.lineinfile:
        path: /root/.bashrc
        regexp: '^#force_color_prompt=yes'
        line: 'force_color_prompt=yes'
        state: present
    - name: set timezone to America/Los_Angeles
      ansible.builtin.timezone:
        name: America/Los_Angeles
    - name: set locale to en_US.UTF-8
      ansible.builtin.locale_gen:
        name: en_US.UTF-8
        state: present

    - import_tasks: homelab/new-container-setup/security.yml
    - import_tasks: homelab/new-container-setup/smtp.yml
      when: smtp | bool
    - import_tasks: homelab/new-container-setup/munin-node.yml
    - import_tasks: homelab/new-container-setup/debian-update.yml
    # - import_tasks: homelab/new-container-setup/zsh-setup.yml
    #   when: install_zsh_dotfiles | bool
    - import_tasks: homelab/new-container-setup/zsh-uninstall.yml

    - name: Install useful packages
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      loop: "{{ packages }}"
